<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Hub - API Costs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FFF8F0; color: #3E2723; padding: 24px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #8D6E63; margin-bottom: 20px; }
  #auth-section { text-align: center; padding: 80px 20px; }
  #auth-section button { background: #5D4037; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  #auth-section button:hover { background: #4E342E; }
  #dashboard { display: none; }
  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filters button { background: #EFEBE9; border: 1px solid #D7CCC8; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; color: #5D4037; }
  .filters button.active { background: #5D4037; color: #fff; border-color: #5D4037; }
  .filters input[type="date"] { padding: 5px 10px; border: 1px solid #D7CCC8; border-radius: 6px; font-size: 13px; background: #fff; color: #3E2723; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #E8E0D8; }
  .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #8D6E63; margin-bottom: 4px; }
  .card .value { font-size: 26px; font-weight: 600; }
  .card .value.cost { color: #E65100; }
  .card .detail { font-size: 12px; color: #8D6E63; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #E8E0D8; margin-bottom: 24px; }
  th { background: #EFEBE9; text-align: left; padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #5D4037; }
  td { padding: 10px 14px; border-top: 1px solid #F0EBE6; font-size: 14px; }
  tr:hover td { background: #FAFAF7; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; margin-top: 8px; }
  .empty { text-align: center; padding: 40px; color: #8D6E63; font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: #8D6E63; }
  #user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  #user-bar span { font-size: 13px; color: #8D6E63; }
  #user-bar button { background: none; border: none; color: #8D6E63; cursor: pointer; font-size: 13px; text-decoration: underline; }
  .refresh-btn { background: none; border: 1px solid #D7CCC8; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; color: #5D4037; margin-left: auto; }
  .refresh-btn:hover { background: #EFEBE9; }
</style>
</head>
<body>

<div id="auth-section">
  <h1>Coffee Hub API Costs</h1>
  <p style="color:#8D6E63; margin-bottom:24px;">Sign in to view your API spending</p>
  <button onclick="signIn()">Sign in with Google</button>
</div>

<div id="dashboard">
  <div id="user-bar">
    <div>
      <h1>API Costs</h1>
      <div class="subtitle" id="date-range-label"></div>
    </div>
    <div>
      <span id="user-email"></span>
      <button onclick="signOut()">sign out</button>
    </div>
  </div>

  <div class="filters">
    <button data-range="today" onclick="setRange('today')">Today</button>
    <button data-range="7d" onclick="setRange('7d')">7 days</button>
    <button data-range="30d" onclick="setRange('30d')" class="active">30 days</button>
    <button data-range="all" onclick="setRange('all')">All time</button>
    <input type="date" id="custom-start" onchange="setRange('custom')">
    <input type="date" id="custom-end" onchange="setRange('custom')">
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>

  <div id="content">
    <div class="loading">Loading...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut as fbSignOut } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
  import { getFirestore, collection, query, where, orderBy, getDocs, Timestamp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

  const app = initializeApp({
    apiKey: 'AIzaSyBdgsKFnRzVDc_PT4AZo1_N0bo5A_lHNJ4',
    authDomain: 'manybeans-7893c.firebaseapp.com',
    projectId: 'manybeans-7893c',
    storageBucket: 'manybeans-7893c.firebasestorage.app',
    messagingSenderId: '902243550931',
    appId: '1:902243550931:web:b2ffcea49e774dd7e3b626',
  });

  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentRange = '30d';

  window.signIn = () => signInWithPopup(auth, new GoogleAuthProvider());
  window.signOut = () => fbSignOut(auth);
  window.setRange = (range) => {
    currentRange = range;
    document.querySelectorAll('.filters button[data-range]').forEach(b => b.classList.toggle('active', b.dataset.range === range));
    loadData();
  };
  window.loadData = loadData;

  onAuthStateChanged(auth, (user) => {
    document.getElementById('auth-section').style.display = user ? 'none' : 'block';
    document.getElementById('dashboard').style.display = user ? 'block' : 'none';
    if (user) {
      document.getElementById('user-email').textContent = user.email;
      loadData();
    }
  });

  function getDateRange() {
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (currentRange === 'today') return { start: startOfDay, end: now, label: 'Today' };
    if (currentRange === '7d') return { start: new Date(now - 7 * 86400000), end: now, label: 'Last 7 days' };
    if (currentRange === '30d') return { start: new Date(now - 30 * 86400000), end: now, label: 'Last 30 days' };
    if (currentRange === 'custom') {
      const s = document.getElementById('custom-start').value;
      const e = document.getElementById('custom-end').value;
      if (s && e) return { start: new Date(s), end: new Date(new Date(e).getTime() + 86400000), label: `${s} to ${e}` };
    }
    return { start: null, end: now, label: 'All time' };
  }

  async function loadData() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading">Loading...</div>';

    try {
      const { start, end, label } = getDateRange();
      document.getElementById('date-range-label').textContent = label;

      let q;
      if (start) {
        q = query(collection(db, 'apiUsage'), where('createdAt', '>=', Timestamp.fromDate(start)), where('createdAt', '<=', Timestamp.fromDate(end)), orderBy('createdAt', 'desc'));
      } else {
        q = query(collection(db, 'apiUsage'), orderBy('createdAt', 'desc'));
      }

      const snap = await getDocs(q);
      if (snap.empty) {
        content.innerHTML = '<div class="empty">No API usage data for this period. Use the app to generate some calls.</div>';
        return;
      }

      const docs = snap.docs.map(d => d.data());
      render(docs);
    } catch (err) {
      console.error(err);
      if (err.code === 'failed-precondition') {
        content.innerHTML = '<div class="empty">Firestore index required. Check the browser console for the index creation link.</div>';
      } else {
        content.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
      }
    }
  }

  function fmt(n) { return '$' + n.toFixed(4); }
  function fmtBig(n) { return '$' + n.toFixed(2); }
  function num(n) { return n.toLocaleString(); }

  function render(docs) {
    const totalCost = docs.reduce((s, d) => s + (d.estimatedCost || 0), 0);
    const totalCalls = docs.length;
    const totalTokens = docs.reduce((s, d) => s + (d.totalTokens || 0), 0);

    // Group by provider
    const byProvider = {};
    docs.forEach(d => {
      const p = d.provider || 'unknown';
      if (!byProvider[p]) byProvider[p] = { calls: 0, cost: 0, tokens: 0 };
      byProvider[p].calls++;
      byProvider[p].cost += d.estimatedCost || 0;
      byProvider[p].tokens += d.totalTokens || 0;
    });

    // Group by feature
    const byFeature = {};
    docs.forEach(d => {
      const f = d.feature || 'unknown';
      if (!byFeature[f]) byFeature[f] = { calls: 0, cost: 0, tokens: 0, provider: d.provider };
      byFeature[f].calls++;
      byFeature[f].cost += d.estimatedCost || 0;
      byFeature[f].tokens += d.totalTokens || 0;
    });

    // Group by model
    const byModel = {};
    docs.forEach(d => {
      const m = d.model || 'unknown';
      if (!byModel[m]) byModel[m] = { calls: 0, cost: 0, tokens: 0 };
      byModel[m].calls++;
      byModel[m].cost += d.estimatedCost || 0;
      byModel[m].tokens += d.totalTokens || 0;
    });

    // Daily totals for sparkline-style list
    const byDay = {};
    docs.forEach(d => {
      const ts = d.createdAt?.toDate?.();
      if (!ts) return;
      const day = ts.toISOString().slice(0, 10);
      if (!byDay[day]) byDay[day] = { calls: 0, cost: 0 };
      byDay[day].calls++;
      byDay[day].cost += d.estimatedCost || 0;
    });

    const providerNames = { anthropic: 'Anthropic', openai: 'OpenAI', gemini: 'Gemini' };

    let html = `
      <div class="summary">
        <div class="card">
          <div class="label">Total Spend</div>
          <div class="value cost">${fmtBig(totalCost)}</div>
          <div class="detail">${num(totalCalls)} API calls</div>
        </div>
        ${Object.entries(byProvider).sort((a, b) => b[1].cost - a[1].cost).map(([p, v]) => `
        <div class="card">
          <div class="label">${providerNames[p] || p}</div>
          <div class="value cost">${fmtBig(v.cost)}</div>
          <div class="detail">${num(v.calls)} calls, ${num(v.tokens)} tokens</div>
        </div>`).join('')}
      </div>

      <div class="section-title">By Feature</div>
      <table>
        <tr><th>Feature</th><th>Provider</th><th class="num">Calls</th><th class="num">Tokens</th><th class="num">Cost</th></tr>
        ${Object.entries(byFeature).sort((a, b) => b[1].cost - a[1].cost).map(([f, v]) => `
        <tr><td>${f}</td><td>${providerNames[v.provider] || v.provider}</td><td class="num">${num(v.calls)}</td><td class="num">${num(v.tokens)}</td><td class="num">${fmt(v.cost)}</td></tr>`).join('')}
      </table>

      <div class="section-title">By Model</div>
      <table>
        <tr><th>Model</th><th class="num">Calls</th><th class="num">Tokens</th><th class="num">Cost</th></tr>
        ${Object.entries(byModel).sort((a, b) => b[1].cost - a[1].cost).map(([m, v]) => `
        <tr><td>${m}</td><td class="num">${num(v.calls)}</td><td class="num">${num(v.tokens)}</td><td class="num">${fmt(v.cost)}</td></tr>`).join('')}
      </table>

      <div class="section-title">Daily Breakdown</div>
      <table>
        <tr><th>Date</th><th class="num">Calls</th><th class="num">Cost</th></tr>
        ${Object.entries(byDay).sort((a, b) => b[0].localeCompare(a[0])).map(([day, v]) => `
        <tr><td>${day}</td><td class="num">${num(v.calls)}</td><td class="num">${fmt(v.cost)}</td></tr>`).join('')}
      </table>
    `;

    document.getElementById('content').innerHTML = html;
  }
</script>

</body>
</html>
