version: 1

meta:
  name: chat-ruphus-study-100x
  source_plan: docs/plans/2026-06-28-004-feat-chat-ruphus-study-100x-plan.md

goal:
  statement: >
    Turn the Chat tab into "Professor Ruphus's study": the mascot present on his messages, editorial
    bubbles (solid user bubbles, no gradient), a characterful "Ruphus is thinking" indicator, tappable
    starter prompts, and a refined scanned-bean result card. Kill the slop tells (the "AI Chat"
    eyebrow-over-H1 + gradient rule, generic gradient chat bubbles, the 3-bouncing-dots indicator, the
    dead accentSoft hint chips, the gradient send button). Presentation only — no Firebase or AI logic
    (claude/gemini, chat context, scan/extract parsing, image pipeline) and no iOS keyboard changes; dev
    channel only.
  definition_of_done: >
    The Chat header has no "AI Chat" eyebrow-over-H1 and no gradient rule (clean Fraunces title +
    subtitle); assistant messages render with the Ruphus mascot avatar + an editorial bubble while user
    bubbles are solid (no gradient); the typing indicator is a characterful "Ruphus is thinking"
    treatment (mascot + calm transform/opacity motion), not bare 3 dots; the intro starter prompts are
    real tappable buttons that send their prompt; a scanned bean renders as a refined editorial result
    card with Brew / Guided Tasting / Save preserved; the send button is solid (no gradient) with a haptic
    on send and the camera + photo strip intact; motion is transform/opacity-only and reduced-motion
    gated with scroll/auto-scroll preserved; gold is scarce with no gradient/glow/accentSoft structural
    chrome; every feature works (text, photo analysis up to 3, streaming, message caps, scan routing,
    Aiden/HandBrew modals, chat context, Pro/paywall gate, iOS keyboard + safe-area); no AI/data/Firebase/
    keyboard logic is touched; `npx vite build` exits 0; the Chat Playwright harness shows no header
    eyebrow/gradient-rule, an assistant Ruphus avatar, solid user bubble + solid send button, tappable
    starter buttons, the characterful thinking indicator on a loading state, reduced-motion without error,
    and zero console errors; verify-archive/verify-inventory/verify-morph still PASS; codex review is clean
    against the rubric; and Tal signs off on device that the Chat feels like Professor Ruphus's study and
    the keyboard/photo/scan flows still work.
  requirements:
    - R1
    - R2
    - R3
    - R4
    - R5
    - R6
    - R7
    - R8
    - R9
  context_sources:
    - file: docs/plans/2026-06-28-004-feat-chat-ruphus-study-100x-plan.md
    - file: docs/plans/2026-06-28-003-feat-tasting-editorial-coach-100x-plan.md
    - file: lessons.md

verification:
  - id: v1-build
    type: programmatic
    check: ["npx", "vite", "build", "--logLevel", "error"]
    expect: exit_zero
  - id: v2-harness
    type: programmatic
    check: ["node", "scripts/verify-chat.mjs"]
    expect: exit_zero
  - id: v3-regression
    type: programmatic
    check: ["node", "scripts/verify-archive.mjs"]
    expect: exit_zero
  - id: v4-review
    type: judge
    judge: codex
    rubric: >
      Adversarially review the Chat "Ruphus's study" diff. Treat the redesign baseline (warm-neutral
      theme, framer-motion, BeanDetailCard morph, the chat AI engine in lib/claude.js + lib/gemini.js, the
      Aiden/HandBrew hooks, useNativeKeyboard) as APPROVED — only judge this change. FAIL if any slop tell
      survives: the "AI Chat" eyebrow directly above the H1, the decorative gradient rule, gradient chat
      bubbles (user bubble must be SOLID), the generic 3-bouncing-dots typing indicator, dead/
      non-interactive accentSoft hint chips, or a gradient send button (R1, R2, R3, R4, R6). FAIL if
      assistant messages do not show the Ruphus mascot avatar / Ruphus has no character (R2). FAIL if the
      typing indicator is not a characterful "Ruphus is thinking" treatment (R3). FAIL if the intro
      starter prompts are not real buttons that send their prompt (R4). FAIL if the scanned-bean result is
      not a refined card or its Brew/Guided-Tasting/Save actions or routing regressed (R5). FAIL if the
      send button is not solid, the camera/photo strip broke, or no haptic on send (R6). FAIL if motion is
      not transform/opacity-only, exceeds 300ms (non-spring)/bounce 0.3, or is not reduced-motion gated, or
      scroll/auto-scroll regressed (R7). FAIL if gold is used beyond send/primary + one active state, or
      gradient/glow/accentSoft structural chrome remains (R8). FAIL if ANY feature regressed — text send,
      photo attach/analyze (≤3), streaming, message caps, bean scan → brew/tasting/save, Aiden/HandBrew
      modals, chat context, paywall gate, or iOS keyboard/safe-area handling — or if the diff touches
      Firebase, the message/scan/extract parsing, buildChatContext, the claude/gemini libs, or
      useNativeKeyboard (R9). PASS only when Ruphus is present + characterful, the slop is gone, every flow
      is preserved, motion is tasteful + gated, and the diff is scope-clean.
  - id: v5-human
    type: human
    prompt: >
      On the dev app (device): open Chat and confirm it feels like Professor Ruphus's study — his avatar
      on his messages, editorial bubbles, a characterful thinking indicator, tappable starter prompts;
      send a message, attach + analyze a photo, and run a bean scan to confirm Brew/Guided-Tasting/Save
      still route; confirm the keyboard opens/closes cleanly with the input bar tracking it — proving R1,
      R2, R3, R4, R5, R6, R9 and the overall feel.

evidence_map:
  R1: v2-harness
  R2: v2-harness
  R3: v2-harness
  R4: v2-harness
  R5: v4-review
  R6: v2-harness
  R7: v2-harness
  R8: v4-review
  R9: v4-review

council:
  - id: codex
    role: judge
    cli: codex

gates:
  plan_gate:
    verdict_policy: revise_until_clean
    verdict_source: codex
    criteria: [v4-review]
    max_revisions: 2
  delivery_gate:
    verdict_policy: revise_until_clean
    verdict_source: codex
    criteria: [v1-build, v2-harness, v3-regression, v4-review, v5-human]
    max_revisions: 3

loop_control:
  max_iterations: 7
  cycle_cap: 4
  quality_streak: 2
  no_progress:
    max_stalled_iterations: 2
    action: stop
  budget:
    tokens: 4000000

scope_guard:
  - Do NOT change Firebase or any AI logic (claude/gemini libs, buildChatContext, message/scan/extract parsing, image pipeline) — reskin output only.
  - Do NOT change iOS keyboard handling (useNativeKeyboard), safe-area math, fixed input-bar positioning, scroll/auto-scroll, or blob-url cleanup — reuse verbatim.
  - Do NOT lose any feature — text, photo analysis (≤3), streaming, message caps, scan → brew/tasting/save routing, Aiden/HandBrew modals, chat context, paywall gate.
  - Do NOT introduce gradient chrome, glow, accentSoft structural fills, or a second accent; gold scarce (send/primary + one active state).
  - Do NOT animate any non-transform/opacity property, exceed 300ms (non-spring)/bounce 0.3, or skip the reduced-motion gate; do not deploy to production or merge to main (dev channel only).

execution:
  mode: goal
  isolation: branch

model_policy:
  orchestrator: opus
  subagents: sonnet
  reviewer: codex
  review_cadence: per_phase
