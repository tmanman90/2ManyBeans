version: 1

meta:
  name: chat-100x
  source_plan: docs/plans/2026-07-07-001-feat-chat-professor-ruphus-100x-plan.md

goal:
  statement: >
    Upgrade the Chat tab (Professor Ruphus) in three phased tiers on the redesign branch, dev
    channel only. Phase A (intelligence): chat moves to claude-sonnet-5 with thinking disabled
    (Haiku fallback pre-first-byte only, thinking param rebuilt per final model, token budgets
    re-baselined via count_tokens); RUPHUS_KNOWLEDGE + TASTING_KNOWLEDGE join the cached static
    prompt; the dynamic block gains the user's sanitized first name and active-rotation origin
    context; the "Scan a bag" chip opens the camera instead of sending text; "Coach my tasting"
    opens the Tasting Wizard (zero beans: in-character line, then a dedicated onNavigateToTasting
    prop — the shared handler's falsy no-op stays for BrewTimer); the scanned-bean Guided Tasting
    button dedupes, saves with a busy state, and hands off; rotation-aware starter prompts ship in
    Phase A; scan truncation can never render raw marker text; the message renderer is extracted
    with UUID keys. Phase B (premium): a NEW api/claude-stream.js endpoint streams NDJSON
    (spike-gated: curl -N transcript proves incremental delivery before any UI work; shared
    constants incl. the FULL RATE_LIMIT with windowMs live in api/_lib/claudeShared.js;
    api/claude.js untouched beyond the allowlist entry); the client streams via
    window.CapacitorWebFetch (CapacitorHttp buffers) with a flagged buffered-transport fallback;
    tokens render in an isolated StreamingBubble (ref buffer + rAF flush, plain DOM + CSS
    entrances, role="log" announce-on-commit, composer disabled in flight); marker hold-back never
    shows partial markers; the conversation persists to users/{uid}/chatSessions/active (rolling
    50-message doc, fire-and-forget LWW-once-hydrated full snapshots, hydration-gated, idb mirror
    unconditional, injectable storage adapter, New chat affordance, additive-only rules deploy);
    brew answers can emit a RECIPE_CARD marker rendered as an editorial card with Brew + capped
    Save-to-notes actions. Phase C (depth): a palate summary (level + per-axis tastingScores
    means, sanitized descriptors) joins the dynamic block; NEEDS_SEARCH two-pass live web answers
    (marker-only response, pass two replaces pass one, capped visible query, untrusted-data
    framing, https-only sources footer from groundingChunks). Everything design-bank clean:
    monochrome + one accent, gradient-free thread, CSS keyframes for entrances, framer only for
    whileTap/layoutId, reduced-motion gated chrome, Professor Ruphus naming, 44pt targets.
    PRE-LOOP PRECONDITION: the "Tal" naming hotfix (user-agnostic prompt wording) ships to
    production BEFORE this loop launches; the loop treats it as landed baseline.
  definition_of_done: >
    All 23 plan requirements verified through the per-tier gate stack. npx vite build exits 0.
    The extended verify-chat harness proves: scan chip opens the picker with no sent bubble; a
    text starter sends; coach-chip spy fires with the first active bean id (and the zero-bean path
    posts the line + fires onNavigateToTasting); scanned-bean handoff saves exactly once with a
    busy state and dedupes; rotation-aware starters derive from seeded beans with static fallback;
    progressive streaming against the stream-mock server (text strictly grows across polls);
    recipe card renders from a mocked marker with save-state transitions; persistence round-trips
    through the injectable adapter (resume, trailing-retry, 50-cap, New chat, key uniqueness);
    reduced-motion pass; zero linear-gradients; zero console errors. verify-stream-parse proves
    marker hold-back across arbitrary chunk splits, truncation rejection, framing-spoof fixtures,
    prose-then-NEEDS_SEARCH replacement, and typed pre-stream errors. All prior verify-* gates
    stay green. The U5 curl -N transcript (multi-timestamp incremental arrival, thinking disabled,
    usage frame with cache fields) exists as evidence; kill-mid-stream shows upstream abort with
    usage still logged; shipping in buffered-fallback mode requires the explicit contract flag.
    The firestore.rules diff is exactly one new chatSessions block, deployed with the fully
    specified command after a dry-run pre-flight, with denial checks and the post-deploy smoke
    check recorded in the loop log. The per-tier evidence gate passes tier A/B on simulator frames
    (thinking loader, two stream-in-progress frames with visibly longer text, recipe card,
    dynamic starters, resumed conversation after relaunch, New chat, scan-chip camera prompt)
    without any tier-C frame; tier C adds search caption + sources footer. Fresh codex passes the
    pre-briefed rubric. Tal signs off on device (v5), including keyboard-during-stream and
    background-and-return checks. Dev channel only; no prod deploy or main merge by the loop.
  requirements:
    - R1
    - R2
    - R3
    - R4
    - R5
    - R6
    - R7
    - R8
    - R9
    - R10
    - R11
    - R12
    - R13
    - R14
    - R15
    - R16
    - R17
    - R18
    - R19
    - R20
    - R21
    - R22
    - R23
  context_sources:
    - file: docs/plans/2026-07-07-001-feat-chat-professor-ruphus-100x-plan.md
    - file: lessons.md
    - file: src/tabs/ChatTab.jsx
    - file: src/lib/claude.js
    - file: api/claude.js
    - file: api/_lib/cors-auth.js
    - file: scripts/verify-chat.mjs
    - file: docs/loops/tasting-polish-2/loop.yaml

verification:
  - id: v1-build
    type: programmatic
    check: ["npx", "vite", "build", "--logLevel", "error"]
    expect: exit_zero
  - id: v2-chat
    type: programmatic
    check: ["node", "scripts/verify-chat.mjs"]
    expect: exit_zero
  - id: v2b-parse
    type: programmatic
    check: ["node", "scripts/verify-stream-parse.mjs"]
    expect: exit_zero
  - id: v3-regression
    type: programmatic
    check: ["bash", "-c", "node scripts/verify-tasting.mjs && node scripts/verify-inventory.mjs && node scripts/verify-archive.mjs && node scripts/verify-morph.mjs && node scripts/verify-wizard.mjs && node scripts/audit-wizard.mjs"]
    expect: exit_zero
  - id: v4-codex
    type: judge
    judge: codex
    rubric: >
      Adversarially review the chat-100x diff, whole-file behavior, not just the asked question.
      PRE-BRIEF (do not false-positive on these): the chat THREAD is intentionally gradient-free
      (the zero-linear-gradient gate is stricter than you); Liquid Glass gradients elsewhere in the
      app are approved material; ambient infinite loops (RuphusThinking dot-matrix, caret blink)
      are EXEMPT from the 300ms micro-interaction rule; the buildTastingSystemPrompt naming edit
      (removing "Tal") is in-scope; filter:brightness press states are the approved pattern.
      FAIL if: chat does not pass model claude-sonnet-5 with thinking disabled rebuilt per final
      model (Haiku fallback must not inherit the param; fallback only pre-first-byte) (R1); any
      user-derived value (displayName, oneWord descriptors, origin echo) reaches a system prompt
      without sanitize() + cap, or user-specific bytes enter a cache_control block (R2,R3); a
      truncated or malformed marker can render raw to the user in either the JSON or stream path
      (R4,R13); the scan chip sends text instead of opening the picker, or the coach/scanned-bean
      handoffs overload the shared onStartTastingSession falsy no-op that BrewTimer depends on
      (R5,R6,R7); api/claude.js changed beyond the allowlist entry + shared-constants import, or
      the stream endpoint forks ALLOWED_MODELS / MAX_TOKENS_CAP / RATE_LIMIT instead of importing
      them, or RATE_LIMIT lacks windowMs (silently disables limiting), or NDJSON frames are not
      exactly one JSON.stringify per line (spoofable) (R8); the client stream path does not use
      CapacitorWebFetch on native or degrades silently when it is absent, or retries after first
      byte (R9); streaming/entrance visuals use framer animate for entrance/visibility (dead in
      this WKWebView; CSS keyframes required; framer only whileTap/layoutId), or the streaming
      bubble is not an isolated leaf with rAF-batched flushes, or the thread lacks role=log with
      commit-time announcement, or the composer stays enabled mid-flight (R10); the autoscroll
      override listens to scroll events instead of touchstart/wheel, or keyboard handling code was
      touched (R11); mid-stream failure discards partial text, contaminates apiMessages, or the
      server cannot log usage on client disconnect (R12); persistence violates the invariants: a
      failed hydration treated as doc-absent, any persist awaited on the send path, a per-write
      freshness-skip scheme (plain LWW once hydrated is the contract), idb mirror coupled to the
      Firestore write, missing New chat cleanup incl. the idb key and cacheClear, or message ids
      that can collide across hydration (R14-R17,R20); the firestore.rules diff touches anything
      beyond one new chatSessions block, or the block misses owner-only + pinned 'active' id +
      keys().hasOnly + messages.size()<=50 (R14); recipe card or save-to-notes lacks length caps,
      busy state, or toasts (R18); starters are not rotation-aware with static/demo fallback
      (R19); NEEDS_SEARCH is in the prompt before U11 ships, the search turn is not marker-only
      with pass-two REPLACING pass-one, the query is uncapped or hidden, grounded content lacks
      untrusted-data framing, or the sources footer renders any non-https scheme or parses URLs
      from model text (R21); any anti-slop tell (second accent hue, glow shadows, purple, missing
      tabular-nums on card numbers, sub-44pt targets), or "Ruphus" bare in user-facing copy
      instead of "Professor Ruphus" (R23). PASS only when all requirement clusters hold, scope
      guards are respected, and the diff regresses nothing in the pre-briefed shipped surface.
  - id: v6-evidence-ab
    type: programmatic
    check: ["node", "scripts/verify-chat-evidence.mjs", "--tier", "ab"]
    expect: exit_zero
  - id: v6c-evidence-c
    type: programmatic
    check: ["node", "scripts/verify-chat-evidence.mjs", "--tier", "c"]
    expect: exit_zero
  - id: v5-human
    type: human
    prompt: >
      On the dev app (real device): open Chat and confirm the greeting uses YOUR name and feels
      like the professor knows your rotation (starters reference your actual jars). Tap "Scan a
      bag" — the camera opens, nothing is sent. Send a question — the dot-matrix loader appears,
      then the reply STREAMS in token by token (not one blob); scroll up mid-stream and confirm
      it stops following, with a jump-to-latest pill; open the keyboard mid-stream and confirm
      nothing breaks; background the app mid-stream, return, and confirm a clean partial+retry
      state (not a stuck loader). Ask for a recipe for a jar — a recipe card renders with clean
      numbers; Brew this opens the right modal; Save to bean notes shows saving then a toast.
      Kill and relaunch the app — the conversation is still there, and a trailing unanswered
      question shows retry. Tap New chat — intro + starters return. Tap "Coach my tasting" — the
      wizard opens on your first active bean. (Phase C, if shipped): ask what to order from a
      roaster — you see "Searching the web: <query>", one single answer with tappable https
      sources. Proving R1-R23 and the overall premium feel.

