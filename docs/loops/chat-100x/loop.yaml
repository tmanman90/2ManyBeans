council:
  - id: codex
    role: judge
    cli: codex

gates:
  plan_gate:
    verdict_policy: revise_until_clean
    verdict_source: codex
    criteria: [v4-codex]
    max_revisions: 2
  delivery_gate:
    verdict_policy: revise_until_clean
    verdict_source: codex
    criteria: [v1-build, v2-chat, v2b-parse, v3-regression, v4-codex, v6-evidence-ab, v6c-evidence-c, v5-human]
    max_revisions: 3

loop_control:
  max_iterations: 13
  cycle_cap: 4
  quality_streak: 2
  no_progress:
    max_stalled_iterations: 2
    action: stop
  budget:
    tokens: 12000000

scope_guard:
  - >-
    PRE-FLIGHT (verify before iterating): the "Tal" naming hotfix is live on production; dry-run
    of "npx firebase-tools deploy --only firestore:rules --project <VITE_FIREBASE_PROJECT_ID>"
    succeeds with non-interactive credentials; window.CapacitorWebFetch exists in the native bridge.
  - >-
    Do NOT touch useNativeKeyboard, input-bar positioning, safe-area math, or scroll/keyboard
    interplay code.
  - >-
    Do NOT change the reactToTastingStep call shape, paywall/demo gating semantics, or any
    non-claude proxy (api/gemini.js, api/openai.js, api/aiden.js) beyond the U11 CLIENT helper
    in src/lib/gemini.js.
  - >-
    api/claude.js changes ONLY: the claude-sonnet-5 allowlist entry and the shared-constants
    import from api/_lib/claudeShared.js. All streaming lives in api/claude-stream.js.
  - >-
    firestore.rules is ADDITIVE-ONLY: the diff must be exactly one new chatSessions match block;
    any edit to an existing block fails the gate; run the post-deploy smoke check (cross-uid bean
    read still denied) and record it in the loop log.
  - >-
    Phase ordering is a hard gate: tier B units do not start until Phase A gates pass; tier C not
    until A+B pass; the U5 streaming spike (curl transcript + disconnect check) passes before ANY
    client streaming UI is written; shipping buffered-fallback requires the explicit contract
    flag, surfaced as a first-class outcome.
  - >-
    CSS keyframes for all entrance/visibility (framer animate is dead in this WKWebView portal);
    framer only for layoutId/whileTap; no animated backdrop-filter, no mix-blend sheen, no
    feDisplacement; ambient loops exempt from the 300ms rule.
  - >-
    The chat thread stays gradient-free (keep the zero-linear-gradient assertion); no
    GlassButton/glass material in-thread; monochrome + single accent; tabular-nums on all card
    numbers; "Professor Ruphus" in all user-facing copy.
  - >-
    Streaming text renders via the isolated StreamingBubble only; never render streamed partials
    through framer-gated visibility; marker hold-back before display, always.
  - >-
    Persistence invariants are non-negotiable: hydration-gated Firestore writes, fire-and-forget
    never-awaited persists, plain LWW once hydrated (NO per-write freshness skip), unconditional
    idb mirroring, chat key added to cacheClear.
  - >-
    Overnight evidence frames come from the SIMULATOR (sim-from-vite recipe, CapacitorUpdater
    autoUpdate off during debugging); the real device is Tal's v5 sign-off. Verify streaming
    behavior in Playwright WebKit, not Chromium, when engine fidelity matters.
  - >-
    Dev channel only: no production Vercel deploy (except the pre-loop hotfix, which is NOT the
    loop's job), no Capgo production channel, no main merge. Dev bundle labels use the
    -devapp.<ts> convention.
  - >-
    Do NOT migrate api/gemini.js to @google/genai, add multi-thread chat history, remove the
    TastingTab legacy block, or add markdown rendering: all explicitly deferred.

execution:
  mode: goal
  isolation: branch

model_policy:
  orchestrator: opus
  subagents: sonnet
  reviewer: codex
  review_cadence: per_phase
