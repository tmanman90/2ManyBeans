<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#00000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2manybeans" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin />
    <title>2manybeans</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;background:#FAF6F1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;font-family:Nunito,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;color:#8A7A6B;">
        <div style="font-family:'Playfair Display',Georgia,serif;font-size:32px;color:#8B5E3C;margin-bottom:12px;">2manybeans</div>
        <div style="font-size:14px;">Opening your beans...</div>
      </div>
    </div>
    <script>
      (function () {
        window.__tmbStartupReady = false;
        window.__tmbShowStartupIssue = function () {
          if (window.__tmbStartupReady) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<div style="min-height:100dvh;background:#FAF6F1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;font-family:Nunito,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center;color:#8A7A6B;"><div style="font-family:Playfair Display,Georgia,serif;font-size:32px;color:#8B5E3C;margin-bottom:12px;">2manybeans</div><div style="font-size:15px;line-height:1.45;margin-bottom:24px;max-width:300px;">The app had trouble opening. Reload to try again.</div><button type="button" onclick="window.location.reload()" style="min-height:44px;padding:12px 26px;font-size:16px;font-weight:700;background:#8B5E3C;color:#fff;border:0;border-radius:12px;">Reload</button></div>';
        };
        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var isScript = target && target.tagName === 'SCRIPT';
          var isModulePreload = target && target.tagName === 'LINK' && target.rel === 'modulepreload';
          if (isScript || isModulePreload) {
            window.__tmbShowStartupIssue();
          }
        }, true);
        window.addEventListener('unhandledrejection', function () {
          window.__tmbShowStartupIssue();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
